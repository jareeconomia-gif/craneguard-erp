services:
  - type: web
    name: craneguard-erp
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: craneguard-db
          property: connectionString
      - key: DATABASE_URL_BLUEPRINT
        fromDatabase:
          name: craneguard-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_STARTUP_ATTEMPTS
        value: "36"
      - key: DB_STARTUP_DELAY_MS
        value: "5000"
      - key: FIRST_ADMIN_EMAIL
        value: admin@mkr.com.mx
      - key: FIRST_ADMIN_PASSWORD
        sync: false
      - key: FIRST_ADMIN_NAME
        value: Administrador MKR

databases:
  - name: craneguard-db
    databaseName: craneguard
    user: craneguard
